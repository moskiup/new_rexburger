# Compila el sitio y lo sube por FTP a new.rexburger.com.mx (Hostinger).
#
# Se ejecuta en cada push a main y a mano desde la pestaña Actions ("Run workflow").
# Configuración en GitHub: Settings > Secrets and variables > Actions (ver docs/despliegue.md).
name: Desplegar

on:
  push:
    branches: [main]
  workflow_dispatch:

# Un solo despliegue a la vez; si llega otro push, el anterior se cancela.
concurrency:
  group: despliegue
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compilar:
    name: Revisar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Instalar dependencias
        run: bun install --frozen-lockfile

      - name: Revisar tipos
        run: bun run check

      - name: Compilar
        run: bun run build
        env:
          # Este despliegue es el sitio nuevo en un subdominio: la dirección y el aviso a buscadores salen de aquí.
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL || 'https://new.rexburger.com.mx' }}
          PUBLIC_NOINDEX: ${{ vars.PUBLIC_NOINDEX || 'true' }}
          PUBLIC_WHATSAPP_PEDIDOS: ${{ vars.PUBLIC_WHATSAPP_PEDIDOS }}
          PUBLIC_FACEBOOK_URL: ${{ vars.PUBLIC_FACEBOOK_URL }}
          PUBLIC_INSTAGRAM_URL: ${{ vars.PUBLIC_INSTAGRAM_URL }}
          PUBLIC_TIKTOK_URL: ${{ vars.PUBLIC_TIKTOK_URL }}
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}

      - name: Guardar el sitio compilado
        uses: actions/upload-artifact@v4
        with:
          name: sitio
          path: dist/
          retention-days: 7

  desplegar:
    name: Subir por FTP
    needs: compilar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: produccion
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sitio
          path: dist/

      # Evita subir al lugar equivocado: la carpeta del servidor debe ser una subcarpeta y terminar en "/".
      - name: Comprobar la carpeta del servidor
        env:
          CARPETA: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          if [ -z "$CARPETA" ] || [ "$CARPETA" = "/" ] || [ "$CARPETA" = "./" ]; then
            echo "::error::FTP_SERVER_DIR está vacío o apunta a la raíz. Debe ser la carpeta del subdominio, por ejemplo public_html/new/"
            exit 1
          fi
          case "$CARPETA" in
            */) ;;
            *) echo "::error::FTP_SERVER_DIR debe terminar en /"; exit 1 ;;
          esac

      - name: Subir por FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          port: ${{ vars.FTP_PORT || '21' }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          # Solo sube lo que cambió y borra lo que ya no existe en el sitio (dentro de server-dir).
          dangerous-clean-slate: false
